[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", ".venv", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501",   # line length — keep diffs focused on real issues
  "B904",   # raise-without-from — noisy in discord.py command handlers
  "BLE001", # blind-except — yt-dlp / Discord I/O often needs broad catches
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
